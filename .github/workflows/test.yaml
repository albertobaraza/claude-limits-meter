name: Test

# On every PR, and before every release: release.yaml calls this workflow, so a merge to main is
# checked once, by the run that then releases it. A bare branch push does not run it: the
# pre-push hook already typechecks and tests locally, and the PR run would only repeat this one.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request makes the run for the previous commit pointless: cancel it. Any other
# run (the one release.yaml calls on main) gets its own group, so it is never cancelled.
concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # No install scripts: nothing here needs one, and a dependency's would run with the job's token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The three jobs above run the same code; the checks below do not depend on the system, so once is enough.
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Package holds exactly what it should
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:package

      # Fails on high and critical advisories only; lower ones are reported, not blocking.
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high

  # The extension loaded into a real VS Code: it activates, registers its commands and has its
  # settings. 1.125.0 is the oldest version package.json promises ("engines"), stable is today's.
  integration:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A healthy run takes under a minute (the VS Code download included): a longer one is a hang, so fail fast.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, vscode: "1.125.0" }
          - { os: ubuntu-latest, vscode: stable }
          - { os: macos-latest, vscode: stable }
          - { os: windows-latest, vscode: stable }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # VS Code is a desktop app: on Linux it needs a display, which Xvfb provides.
      - name: Run the integration test
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb
          xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}

      - name: Run the integration test
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}

  # The packaged .vsix installed in a real VS Code and driven through its window: what the status bar, its hover and
  # its menu really show in a Production build, which the job above cannot see. Linux only for now.
  ui:
    name: UI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A screen big enough for the VS Code window: Xvfb's default is 640x480.
      - name: Run the UI test
        run: |
          command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb
          xvfb-run -a -s "-screen 0 1280x800x24" npm run test:ui

      # A failed scenario also leaves a screenshot of the window where it failed.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: .vscode-test/screenshots
          if-no-files-found: ignore
          retention-days: 7
